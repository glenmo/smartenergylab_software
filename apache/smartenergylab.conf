# /etc/apache2/sites-available/smartenergylab.conf
#
# Three vhosts on port 443 (plus three :80 redirects), all reverse-
# proxying to the same Flask app at 127.0.0.1:8000. Routing between
# portal / fox / solis is done inside Flask by reading the Host header.
#
# Required Apache modules:
#   sudo a2enmod ssl proxy proxy_http headers rewrite
#
# Certificate assumed to be a wildcard for *.smartenergylab.software
# (so a single cert covers all three vhosts). If you prefer separate
# certs per subdomain, point each SSLCertificateFile/KeyFile pair at
# the right files. Issuance commands are in the README.

# ====================================================================
# 1. Apex domain — portal + login + forgot/reset
# ====================================================================
<VirtualHost *:80>
    ServerName smartenergylab.software
    Redirect permanent / https://smartenergylab.software/
</VirtualHost>

<VirtualHost *:443>
    ServerName smartenergylab.software

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/smartenergylab.software/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/smartenergylab.software/privkey.pem

    # Forward the original Host: + scheme so Flask can route by host
    # and url_for() generates absolute HTTPS URLs in reset emails.
    ProxyPreserveHost     On
    ProxyRequests         Off
    ProxyPass        /  http://127.0.0.1:8000/  retry=1 timeout=60
    ProxyPassReverse /  http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"

    ErrorLog  ${APACHE_LOG_DIR}/smartenergylab-error.log
    CustomLog ${APACHE_LOG_DIR}/smartenergylab-access.log combined
</VirtualHost>

# ====================================================================
# 2. fox.smartenergylab.software — reverse-proxied Fox dashboard
# ====================================================================
<VirtualHost *:80>
    ServerName fox.smartenergylab.software
    Redirect permanent / https://fox.smartenergylab.software/
</VirtualHost>

<VirtualHost *:443>
    ServerName fox.smartenergylab.software

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/smartenergylab.software/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/smartenergylab.software/privkey.pem

    ProxyPreserveHost     On
    ProxyRequests         Off
    # Long timeout — the Fox CSV export streams 30 days of 10 s samples
    # over a slow uplink; 600 s gives plenty of margin.
    ProxyPass        /  http://127.0.0.1:8000/  retry=1 timeout=600
    ProxyPassReverse /  http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"

    ErrorLog  ${APACHE_LOG_DIR}/fox-smartenergylab-error.log
    CustomLog ${APACHE_LOG_DIR}/fox-smartenergylab-access.log combined
</VirtualHost>

# ====================================================================
# 3. solis.smartenergylab.software — reverse-proxied Solis dashboard
# ====================================================================
<VirtualHost *:80>
    ServerName solis.smartenergylab.software
    Redirect permanent / https://solis.smartenergylab.software/
</VirtualHost>

<VirtualHost *:443>
    ServerName solis.smartenergylab.software

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/smartenergylab.software/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/smartenergylab.software/privkey.pem

    ProxyPreserveHost     On
    ProxyRequests         Off
    ProxyPass        /  http://127.0.0.1:8000/  retry=1 timeout=600
    ProxyPassReverse /  http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"

    ErrorLog  ${APACHE_LOG_DIR}/solis-smartenergylab-error.log
    CustomLog ${APACHE_LOG_DIR}/solis-smartenergylab-access.log combined
</VirtualHost>

# /etc/apache2/sites-available/smartenergylab.conf
#
# Four vhosts on port 443 (plus four :80 redirects), all reverse-
# proxying to the same Flask app at 127.0.0.1:8000. Routing between
# portal / fox / solis / tools is done inside Flask by reading the Host
# header.
#
# Required Apache modules:
#   sudo a2enmod ssl proxy proxy_http headers rewrite
#
# All four vhosts point at ONE Let's Encrypt certificate: a SAN cert
# naming each host explicitly (apex + fox + solis + tools), NOT a
# wildcard — HTTP-01 issuance needs no DNS gymnastics. Issuance
# commands are in README §7.
#
# Because the names are explicit, ADDING A SUBDOMAIN MEANS REISSUING
# THE CERT with the new -d flag. Skip that and the new vhost serves
# whichever cert Apache falls back to, and browsers reject it.

# ====================================================================
# 1. Apex domain — portal + login + forgot/reset
# ====================================================================
<VirtualHost *:80>
    ServerName smartenergylab.software

    # Allow ACME HTTP-01 through to the webroot so `certbot renew` works
    # without needing to bounce Apache or do DNS surgery.
    Alias    "/.well-known/acme-challenge/" "/var/www/html/.well-known/acme-challenge/"
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    # Everything else: redirect to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName smartenergylab.software

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/smartenergylab.software/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/smartenergylab.software/privkey.pem

    # Forward the original Host: + scheme so Flask can route by host
    # and url_for() generates absolute HTTPS URLs in reset emails.
    # ACME HTTP-01 must never reach Flask. If anything redirects the
    # challenge to HTTPS, ProxyPass would hand it to the app: the apex
    # 404s it and the gated subdomains bounce it to /login — which is
    # exactly how a renewal fails with "Invalid response".
    # The `!` exclusion MUST come before ProxyPass / , and is required
    # even with the Alias below, because ProxyPass otherwise wins.
    ProxyPass        /.well-known/acme-challenge/  !
    Alias    "/.well-known/acme-challenge/" "/var/www/html/.well-known/acme-challenge/"
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    ProxyPreserveHost     On
    ProxyRequests         Off
    ProxyPass        /  http://127.0.0.1:8000/  retry=1 timeout=60
    ProxyPassReverse /  http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "%{HTTP_HOST}s"

    ErrorLog  ${APACHE_LOG_DIR}/smartenergylab-error.log
    CustomLog ${APACHE_LOG_DIR}/smartenergylab-access.log combined
</VirtualHost>

# ====================================================================
# 2. fox.smartenergylab.software — reverse-proxied Fox dashboard
# ====================================================================
<VirtualHost *:80>
    ServerName fox.smartenergylab.software

    Alias    "/.well-known/acme-challenge/" "/var/www/html/.well-known/acme-challenge/"
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName fox.smartenergylab.software

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/smartenergylab.software/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/smartenergylab.software/privkey.pem

    # ACME HTTP-01 must never reach Flask. If anything redirects the
    # challenge to HTTPS, ProxyPass would hand it to the app: the apex
